name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:            # cancel superseded runs on the same ref
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # least privilege; the default token is read-only

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt hypothesis
          pip install -e .
      - name: Ruff (lint + format check)
        run: |
          ruff check src tests
          ruff format --check src/envs src/evaluation/uncertainty.py
      - name: Mypy
        run: mypy src
      - name: Tests with coverage gate
        run: >
          pytest tests/ -m "not slow" --ignore=tests/test_hpo.py
          --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - name: Optimised-mode smoke test (asserts are stripped under -O)
        run: >
          python -O -c "from src.envs.hedging_env import HedgingEnv, ConfigurationError;
          import numpy as np;
          e=HedgingEnv();
          try: HedgingEnv(S0=-1)
          except ConfigurationError: pass
          else: raise SystemExit('validation vanished under -O')
          e.reset(seed=0);
          try: e.step(np.array([np.nan]))
          except ValueError: pass
          else: raise SystemExit('NaN guard vanished under -O')"
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  supply-chain:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip-audit -r requirements.txt
