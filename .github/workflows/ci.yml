name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:            # cancel superseded runs on the same ref
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read        # least privilege; the default token is read-only

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lockfile: requirements-py311.lock.txt
            dev-lockfile: requirements-dev-py311.lock.txt
          - python-version: "3.12"
            lockfile: requirements-py312.lock.txt
            dev-lockfile: requirements-dev-py312.lock.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes \
            -r ${{ matrix.lockfile }} \
            -r ${{ matrix.dev-lockfile }}
          python -m pip install --no-deps -e .
      - name: Ruff (lint + format check)
        run: |
          ruff check src tests
          ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Tests with coverage gate
        run: >
          pytest tests/ -m "not slow" --ignore=tests/test_hpo.py
          --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - name: Optimised-mode smoke test (asserts are stripped under -O)
        shell: bash
        run: |
          python -O - <<'PY'
          from src.envs.hedging_env import HedgingEnv, ConfigurationError
          import numpy as np

          env = HedgingEnv()

          try:
              HedgingEnv(S0=-1)
          except ConfigurationError:
              pass
          else:
              raise SystemExit("validation vanished under -O")

          env.reset(seed=0)

          try:
              env.step(np.array([np.nan]))
          except ValueError:
              pass
          else:
              raise SystemExit("NaN guard vanished under -O")
          PY
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  supply-chain:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Audit all hashed lockfiles
        run: |
          python -m pip install pip-audit
          pip-audit --require-hashes \
            -r requirements-py311.lock.txt \
            -r requirements-dev-py311.lock.txt
          pip-audit --require-hashes \
            -r requirements-py312.lock.txt \
            -r requirements-dev-py312.lock.txt
